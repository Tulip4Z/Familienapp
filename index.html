:root{color-scheme:light;--bg:#efeee9;--card:#fff;--line:#e4e2dc;--ink:#121214;--mute:#6c6b72;--pink:#ff2d87;--orange:#ff6a3d;--lime:#d4ff3a;--blue:#3d6bff;--teal:#1f1f23;--sun:var(--lime);--night:#151517;--grad:linear-gradient(135deg,#ff2d87,#ff6a3d);--red:var(--pink);--redd:#e0005f;--on:#fff;--tod:#ff2d87;--r:22px}

.seg button{border:0;background:none;border-radius:99px;min-height:40px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.ib{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center;padding:0;color:var(--mute)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile.dark .ib{background:#2a2a2f;color:#9d9ca4}
.tile.dog{background:#f3e7da}
.tile.fed{background:var(--lime)}
.tile.fed span{color:var(--ink)}
.walks{list-style:none;margin:8px 0 0;padding:0;width:100%;display:grid}
.walks li{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid #2c2c31}
.walks li span{font:600 15px "Space Grotesk",Inter,sans-serif;color:#9d9ca4;min-width:3.2em}.walks li b{flex:1;color:#fff}
.btn.lime{background:var(--lime);color:var(--ink)}
.bars{display:grid;gap:8px;background:#fff;border-radius:var(--r);padding:14px 16px}
.bars div{display:grid;grid-template-columns:5.5em minmax(0,1fr) 2em;gap:10px;align-items:center}
.bars b{font-weight:600}.bars i{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;display:block}.bars em{display:block;height:100%;border-radius:5px}
.bars span{text-align:right;font:700 16px "Space Grotesk",Inter,sans-serif}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--mute);vertical-align:1px}
.sync[hidden]{display:none}
.item.acc{grid-template-columns:minmax(0,1fr) auto;padding:10px 10px 10px 14px}
.item.acc span{display:grid}.item.acc small{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis}
pre.invite{white-space:pre-wrap;font:14px/1.45 Inter,system-ui,sans-serif;background:var(--bg);border-radius:14px;padding:14px;margin:12px 0 0;user-select:text;-webkit-user-select:text}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:#bbb}
.sync[data-st=live]::before{background:#7bc800}.sync[data-st=off]::before{background:var(--pink)}
body.gate .tabs{display:none}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.panel,.toast,.pop .ck{animation:none}}
@media (min-width:700px){.days{grid-template-columns:1fr 1fr}.bento{grid-template-columns:repeat(4,minmax(0,1fr))}.tile.w2{grid-column:span 2}}
</style>
</head>
<body>
<div class="top"><div class="tx"><small id="today"></small> <span id="sync" class="sync" hidden></span><h1 id="title">Unsere Woche</h1></div></div>
<main id="main"></main>
<nav class="tabs" aria-label="Bereiche">
  <button data-act="tab" data-v="woche"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 13h3M8 16h6"/></svg>Start</button>
  <button data-act="tab" data-v="kalender"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/><circle cx="12" cy="15" r="1.5"/></svg>Kalender</button>
  <button data-act="tab" data-v="dienste"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>To-dos</button>
  <button data-act="tab" data-v="essen"><svg viewBox="0 0 24 24"><path d="M3 12h18a9 9 0 0 1-18 0zM7 8c0-2 2-2 2-4M12 8c0-2 2-2 2-4M17 8c0-2 2-2 2-4"/></svg>Essen</button>
  <button data-act="tab" data-v="einkauf"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>Einkauf<em class="badge" id="shopBadge" hidden></em></button>
  <button data-act="tab" data-v="mehr"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Mehr</button>
</nav>
<div id="sheet" hidden></div>

<script>
{
const KEY='familienapp-v1';
const DL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const REM={'':'Keine Erinnerung','0':'Zur Startzeit','10':'10 Min. vorher','30':'30 Min. vorher','60':'1 Std. vorher','120':'2 Std. vorher','1440':'1 Tag vorher'};
const REP={none:'Einmalig',daily:'Täglich',weekly:'Jede Woche',biweekly:'Alle 2 Wochen',monthly:'Jeden Monat',yearly:'Jedes Jahr'};
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const monday=d=>add(d,-((d.getDay()+6)%7));
const fmt=d=>d.getDate()+'. '+MON[d.getMonth()].slice(0,3)+'.';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kw=d=>{const t=new Date(d);t.setDate(t.getDate()+3-(t.getDay()+6)%7);const w=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w)/864e5-3+(w.getDay()+6)%7)/7)};

/* ---------- Daten (später austauschbar gegen Cloud-Sync) ---------- */
function SEED_CHORES(){
  return [['Hunderunde',''],['Spülmaschine ausräumen','m4'],['Wäsche anstellen',''],['Wäsche aufhängen','m3'],['Staubsaugen',''],['Rasen mähen','m4'],['Müll rausbringen',''],['Bad putzen','']].map(([name,def])=>({id:uid(),name,def}));
}
function SEED_STORES(){return[{id:'aldi',name:'ALDI / Lebensmittel',color:'#ff8a3d'},{id:'dm',name:'DM',color:'#ff2d87'},{id:'bau',name:'Baumarkt',color:'#7b3fe4'},{id:'sonst',name:'Sonstiges',color:'#12c9b8'}]}
function seed(){
  let tue=today();while(tue.getDay()!==2)tue=add(tue,1);
  return {v:1,
    members:[{id:'m1',name:'Miriam',color:'#ff2d87',role:'Eltern'},{id:'m2',name:'Achim',color:'#7b3fe4',role:'Eltern'},{id:'m4',name:'Mats',color:'#ff8a3d',role:'Kind'},{id:'m3',name:'Mia',color:'#12c9b8',role:'Kind'},{id:'dog',name:'Hund',color:'#9b7350',role:'Hund'}],
    events:[{id:uid(),title:'Müll rausstellen',date:ds(tue),time:'',who:[],repeat:'weekly',note:'',remind:'1440'}],
    chores:SEED_CHORES(),tasks:[],fam:2,
    meals:{},shop:[],shopHist:{},stores:SEED_STORES(),
    mealTypes:['Kochen','Pizza','Reste','Bestellen','Auswärts','Brotzeit'],
    rules:{time:'19:30',byDay:{4:{type:'Pizza',dish:'Pizzadonnerstag'}}}};
}
let S=null,META={};
try{META=JSON.parse(localStorage.getItem(KEY+'-meta'))||{}}catch(e){}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.v)S=seed();
const OLD={"#e5533d": "#ff2e93", "#2f7d4f": "#2a4bff", "#7b5cd6": "#00b8e6", "#e8961c": "#ffb800", "#3d7fd9": "#2a4bff", "#4b3b8f": "#7a5cff", "#8a948e": "#9aa3c7", "#2f9d8f": "#00b8e6", "#d9822b": "#ff7ac0", "#c2507a": "#7a5cff"};
for(const x of S.members)if(OLD[x.color])x.color=OLD[x.color];
const SUN={'#ff2e93':'#ff2d87','#2a4bff':'#7b3fe4','#00b8e6':'#12c9b8'};for(const x of S.members)if(SUN[x.color])x.color=SUN[x.color];
if(!S.fam){const nm={m1:'Miriam',m2:'Achim'};for(const m of S.members)if(nm[m.id]&&['Ich','Partner'].includes(m.name))m.name=nm[m.id];
  if(!S.members.some(m=>m.id==='m4'||m.name==='Mats')){const i=S.members.findIndex(m=>m.id==='m3');S.members.splice(i<0?S.members.length:i,0,{id:'m4',name:'Mats',color:'#ff8a3d'})}S.fam=1}
if(!S.tasks){S.chores=SEED_CHORES();S.tasks=[];delete S.assign;delete S.done;delete S.shifts;delete S.shiftTypes}
if(S.fam<2){const r={Miriam:'Eltern',Achim:'Eltern',Mats:'Kind',Mia:'Kind'};for(const m of S.members)if(!m.role&&r[m.name])m.role=r[m.name];S.fam=2}
for(const e of S.events)if(e.remind==null&&e.title==='Müll rausstellen')e.remind='1440';
if(!S.stores){S.stores=SEED_STORES();S.shop=[];S.shopHist={}}
if(!META.ever&&!S.members.some(m=>m.role==='Hund'))S.members.push({id:'dog',name:'Hund',color:'#9b7350',role:'Hund'});
if(!S.projects&&!META.ever){const t=Date.now();S.projects=['Außenwasser','E-Bike-Akku','Abfluss Dach','Winterreifen wechseln'].map((title,i)=>({id:uid(),title,status:'offen',who:[],due:'',budget:'',steps:[],note:'',t:t+i}))}
if(!S.dog)S.dog={walks:[],feed:{},info:''};
if(!S.projects)S.projects=[];
if(!S.loans)S.loans=[];
for(const c of ['members','stores','chores'])(S[c]||[]).forEach((x,i)=>{if(x.o==null)x.o=i});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof schedulePush==='function')schedulePush()};

const member=id=>S.members.find(m=>m.id===id);
const people=()=>S.members.filter(m=>m.role!=='Hund');
const dog=()=>S.members.find(m=>m.role==='Hund');
const PST={offen:'Offen',arbeit:'In Arbeit',fertig:'Erledigt'};
function nextOcc(e){for(let i=0;i<400;i++){const s=ds(add(today(),i));if(occurs(e,s))return s}return''}
const tasksOn=s=>S.tasks.filter(t=>t.date===s);
const DAYORD=[1,2,3,4,5,6,0];
function meal(s){
  const r=S.rules.byDay[pd(s).getDay()]||{},o=S.meals[s];
  return o?{...o,def:false}:{time:S.rules.time,type:r.type||'',dish:r.dish||'',cook:'',def:true};
}
function occurs(e,s){
  if(s<e.date)return false;if(s===e.date)return true;
  const a=pd(e.date),b=pd(s);
  switch(e.repeat){
    case'daily':return true;
    case'weekly':return a.getDay()===b.getDay();
    case'biweekly':return a.getDay()===b.getDay()&&Math.round((b-a)/864e5)%14===0;
    case'monthly':return a.getDate()===b.getDate();
    case'yearly':return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
  }return false;
}
const eventsOn=s=>S.events.filter(e=>occurs(e,s)).sort((x,y)=>(x.time||'00').localeCompare(y.time||'00'));
const evColor=e=>member(e.who?.[0])?.color||'#ff2e93';

/* ---------- Ansichten ---------- */
let popId='',fWho='',view='woche',calM=new Date(today().getFullYear(),today().getMonth(),1),sel=ds(today()),wOff=0,eOff=0;

function evRow(e){
  const who=(e.who||[]).map(member).filter(Boolean);
  return `<li><button data-act="editEv" data-id="${e.id}"><span class="t">${esc(e.time||'Ganztags')}</span><span>${esc(e.title)}${who.length?`<span class="who">${who.map(m=>`<i style="background:${m.color}" title="${esc(m.name)}"></i>`).join('')}</span>`:''}${e.repeat!=='none'?`<span class="rep">↻ ${REP[e.repeat]}</span>`:''}</span></button></li>`;
}
function mealBtn(s){
  const m=meal(s),title=m.dish||m.type||'Abendessen planen';
  const extra=[m.dish&&m.type?m.type:'',m.cook&&member(m.cook)?'kocht: '+member(m.cook).name:''].filter(Boolean).join(' · ');
  return `<button class="meal${!m.dish&&!m.type?' def':''}" data-act="meal" data-d="${s}"><span class="mt">${esc(m.time)}</span><span><b>${esc(title)}</b>${extra?`<small>${esc(extra)}</small>`:''}</span></button>`;
}
function greet(){const h=new Date().getHours();return h<5?'Gute Nacht':h<11?'Guten Morgen':h<17?'Hallo zusammen':h<22?'Guten Abend':'Gute Nacht'}
function until(dt){const m=Math.round((dt-new Date())/6e4);if(m<1)return'jetzt';if(m<60)return'in '+m+' Min.';const h=Math.floor(m/60),r=m%60;return'in '+h+' Std.'+(r?' '+r+' Min.':'')}
function at(s,time){const d=pd(s),[h,m]=time.split(':').map(Number);d.setHours(h,m);return d}
function vDash(){
  const t=today(),s=ds(t),now=new Date(),ev=eventsOn(s),tk=tasksOn(s),dn=tk.filter(x=>x.done).length,tm=ds(add(t,1)),evM=eventsOn(tm),tkM=tasksOn(tm);
  const next=ev.find(e=>e.time&&at(s,e.time)>now),allDay=ev.filter(e=>!e.time),later=ev.filter(e=>e.time&&at(s,e.time)>now&&e!==next);
  const m=meal(s),mt=m.time?at(s,m.time):null,open=S.shop.filter(i=>!i.done);
  const p=tk.length?dn/tk.length:0,C=2*Math.PI*34;
  const per=people().map(x=>{const o=tk.filter(k=>k.who===x.id&&!k.done).length;return o?`<span class="pp" style="--c:${x.color}">${esc(x.name)} ${o}</span>`:''}).join('');
  const byStore=S.stores.map(x=>{const n=open.filter(i=>i.store===x.id).length;return n?`<span class="pp">${esc(x.name.split(' /')[0])} ${n}</span>`:''}).join('');
  const mm=meal(tm),mtxt=[mm.dish||mm.type?esc(mm.dish||mm.type):'',...evM.map(e=>esc((e.time?e.time+' ':'')+e.title)),tkM.length?tkM.length+(tkM.length===1?' To-do':' To-dos'):''].filter(Boolean).join(' · ');
  return `<section class="bento">
  <div class="tile dark w2"><div class="lb"><span>${next?'Nächster Termin':'Termine heute'}</span>${next?`<span class="chipc">${until(at(s,next.time))}</span>`:''}</div>
    ${next?`<button class="nxt" data-act="editEv" data-id="${next.id}"><span class="big">${esc(next.time)}</span><b>${esc(next.title)}</b></button>`:`<div class="nxt"><b>${ev.length?'Für heute ist nichts mehr offen.':'Heute steht nichts an.'}</b></div>`}
    ${later.length||allDay.length?`<ul class="evs" style="width:100%;margin-top:10px">${[...allDay,...later].map(evRow).join('')}</ul>`:''}
    <button class="add" data-act="newEv" data-d="${s}">+ Termin</button></div>
  <button class="tile" data-act="tab" data-v="dienste"><div class="lb"><span>To-dos heute</span></div>
    <svg class="ring${tk.length&&dn===tk.length?' full':''}" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34"/>${p?`<circle cx="42" cy="42" r="34" class="pr" style="stroke-dasharray:${C*p} ${C}"/>`:''}<text x="42" y="49">${tk.length?dn+'/'+tk.length:'–'}</text></svg>
    <span>${!tk.length?'Nichts eingetragen':dn===tk.length?'Alles erledigt':(tk.length-dn)+' noch offen'}</span>${per?`<div class="pps">${per}</div>`:''}</button>
  <button class="tile acc" data-act="tab" data-v="einkauf"><div class="lb"><span>Einkauf</span></div><div class="big">${open.length}</div><span>${open.length===1?'Artikel offen':open.length?'Artikel offen':'Alles da'}</span>${byStore?`<div class="pps">${byStore}</div>`:''}</button>
  <div class="tile w2"><div class="lb"><span>Abendessen</span>${mt&&mt>now?`<span>${until(mt)}</span>`:''}</div>
    <button class="mealt" data-act="meal" data-d="${s}" style="margin-top:8px"><span class="big">${esc(m.time)}</span><span><b>${esc(m.dish||m.type||'Noch nicht geplant')}</b>${m.dish&&m.type?`<span>${esc(m.type)}</span>`:''}</span></button></div>
  ${(()=>{const h=dog(),wk=S.dog.walks.filter(w=>w.date===s),po=S.projects.filter(p=>p.status!=='fertig'),nd=po.filter(p=>p.due).sort((a,b)=>a.due.localeCompare(b.due))[0];
    return (h?`<button class="tile dog" data-act="tab" data-v="hund"><div class="lb"><span>${esc(h.name)}</span></div><div class="big">${wk.length}×</div><span>${wk.length?'Gassi · zuletzt '+esc(wk.sort((a,b)=>a.time.localeCompare(b.time))[wk.length-1].time):'Heute noch nicht Gassi'}</span><div class="pps"><span class="pp">${S.dog.feed[s+'|am']?'✓':'○'} Futter früh</span><span class="pp">${S.dog.feed[s+'|pm']?'✓':'○'} abends</span></div></button>`:'')
    +`<button class="tile" data-act="tab" data-v="projekte"><div class="lb"><span>Projekte</span></div><div class="big">${po.length}</div><span>${nd?'Nächstes: '+esc(nd.title)+' bis '+fmt(pd(nd.due)):po.length?'offen':'Alles erledigt'}</span></button>`})()}
  <div class="tile soft w2"><div class="lb"><span>Morgen · ${DL[add(t,1).getDay()]}</span></div><b style="margin-top:6px;font-weight:500">${mtxt||'Noch nichts geplant.'}</b></div>
  </section>`;
}
function vWoche(){
  const t=today();let h=vDash()+'<h2>Die nächsten Tage</h2><div class="days">';
  for(let i=1;i<7;i++){
    const d=add(t,i),s=ds(d),ev=eventsOn(s);
    const sh=S.members.map(m=>{const cs=tasksOn(s).filter(t=>t.who===m.id);return cs.length?`<button class="cline" data-act="gotoChores" data-d="${s}" style="--c:${m.color}"><b>${esc(m.name)}</b><span>${cs.map(t=>`<span class="${t.done?'ok':''}">${esc(t.name)}</span>`).join(', ')}</span></button>`:''}).join('');
    h+=`<article class="day${i===0?' now':''}"><header><div class="dn">${i===0?'Heute':i===1?'Morgen':DL[d.getDay()]}</div><div class="dd">${i<2?DL[d.getDay()].slice(0,2)+', ':''}${fmt(d)}</div></header>
      ${mealBtn(s)}${sh?`<div class="clines">${sh}</div>`:''}
      ${ev.length?`<ul class="evs">${ev.map(evRow).join('')}</ul>`:''}
      <button class="add" data-act="newEv" data-d="${s}">+ Termin</button></article>`;
  }
  return h+'</div>';
}
function vKalender(){
  const y=calM.getFullYear(),mo=calM.getMonth(),first=new Date(y,mo,1),start=add(first,-((first.getDay()+6)%7)),ts=ds(today());
  let g='';
  for(let i=0;i<42;i++){
    const d=add(start,i),s=ds(d),ev=eventsOn(s);
    g+=`<button class="cell${d.getMonth()!==mo?' out':''}${s===ts?' td':''}${s===sel?' sel':''}" data-act="pick" data-d="${s}" aria-label="${d.getDate()}. ${MON[d.getMonth()]}, ${ev.length} Termine"><span>${d.getDate()}</span><i>${ev.slice(0,3).map(e=>`<em style="background:${evColor(e)}"></em>`).join('')}</i></button>`;
  }
  const sd=pd(sel),ev=eventsOn(sel);
  return `<div class="mhead"><button class="nav" data-act="calPrev" aria-label="Voriger Monat">‹</button><h1>${MON[mo]} ${y}</h1><button class="nav" data-act="calNext" aria-label="Nächster Monat">›</button></div>
  <div class="grid wd">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<b>${x}</b>`).join('')}</div><div class="grid">${g}</div>
  <section class="sel"><h2>${DL[sd.getDay()]}, ${sd.getDate()}. ${MON[sd.getMonth()]}</h2>${mealBtn(sel)}
  <ul class="evs">${ev.map(evRow).join('')||'<li class="empty">Keine Termine</li>'}</ul><button class="add" data-act="newEv" data-d="${sel}">+ Termin</button></section>`;
}
function vDienste(){
  const mon=add(today(),wOff*7),days=[...Array(7)].map((_,i)=>add(mon,i)),ts=ds(today()),set=new Set(days.map(ds));
  const cnt={};people().forEach(m=>cnt[m.id]={n:0,d:0});
  S.tasks.forEach(t=>{if(set.has(t.date)&&cnt[t.who]){cnt[t.who].n++;if(t.done)cnt[t.who].d++}});
  let h=`<div class="mhead"><button class="nav" data-act="wPrev" aria-label="7 Tage zurück">‹</button><h1>${wOff===0?'Nächste 7 Tage':'KW '+kw(mon)}</h1><button class="nav" data-act="wNext" aria-label="7 Tage weiter">›</button></div>
  <p class="sub" style="text-align:center;margin-top:4px">${fmt(days[0])} – ${fmt(days[6])}</p>
  <div class="score">${people().map(m=>{const c=cnt[m.id],p=c.n?Math.round(c.d/c.n*100):0;return `<button data-act="fWho" data-id="${m.id}" style="--c:${m.color}"${fWho===m.id?' aria-pressed="true"':''}><b>${esc(m.name)}</b><span>${c.d}/${c.n}</span><i><em style="width:${p}%"></em></i></button>`}).join('')}</div>
  ${fWho?`<p class="sub">Gefiltert auf ${esc(member(fWho)?.name)} · <button class="linkb" data-act="fWho" data-id="${fWho}">alle zeigen</button></p>`:''}`;
  for(const d of days){
    const s=ds(d),ts2=tasksOn(s).filter(t=>!fWho||t.who===fWho);
    h+=`<section class="cday${s===ts?' td':''}"><h2>${s===ts?'Heute':DL[d.getDay()]} <span class="dd">${fmt(d)}</span></h2>${ts2.length?`<ul class="todo">${ts2.map(t=>{const w=member(t.who);

function dueReminders(){

      const [h,m]=(e.time||'08:00').split(':').map(Number),start=pd(s);start.setHours(h,m);
      const at=new Date(start-Number(e.remind)*6e4),end=new Date(+start+(e.time?60:12*60)*6e4),k=e.id+'|'+s;
      if(now>=at&&now<end&&!S.dismissed[k])out.push({k,title:e.title,start,allDay:!e.time,s});}}
  const s=ds(today()),open=tasksOn(s).filter(t=>!t.done&&member(t.who));
  if(now.getHours()>=16&&open.length&&!S.dismissed['tasks|'+s])out.push({k:'tasks|'+s,tasks:open});

function confetti(x,y,big){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas'),g=c.getContext('2d'),dpr=devicePixelRatio||1;
  c.className='confetti';c.width=innerWidth*dpr;c.height=innerHeight*dpr;document.body.append(c);g.scale(dpr,dpr);
  const cols=['#ff2d87','#d4ff3a','#121214','#ff6a3d','#3d6bff','#ffffff'],n=big?180:70;
  const P=[...Array(n)].map(()=>{const a=big?Math.random()*Math.PI*2:-Math.PI/2+(Math.random()-.5)*2.2,v=(big?6:4)+Math.random()*(big?9:7);
    return{x:big?innerWidth/2:x,y:big?innerHeight*.4:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*6,h:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[n%7===0?0:Math.floor(Math.random()*cols.length)]}});
  let t0=performance.now();
  (function f(t){const k=(t-t0)/1000;g.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,1-k/(big?2.6:1.8));g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()}
    if(k<(big?2.6:1.8))requestAnimationFrame(f);else c.remove()})(t0);
}

  S.members.sort(by(x=>x.o));S.stores.sort(by(x=>x.o));S.chores.sort(by(x=>x.o));S.tasks.sort(by(x=>x.t));S.shop.sort(by(x=>x.t));S.projects.sort(by(x=>x.t));S.loans.sort(by(x=>x.t));
  S.dog.walks.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function setSync(st){const el=$('#sync');if(!el)return;el.hidden=!CLOUD||!!gate;el.dataset.st=st;el.textContent=st==='live'?'Live':st==='busy'?'Verbinde …':'Offline'}
let pushT,pushing=false,again=false,retryT;
function schedulePush(){if(!CLOUD)return;clearTimeout(pushT);pushT=setTimeout(pushNow,350)}
async function pushNow(){
  if(!sb||!session||!META.ever)return;if(pushing){again=true;return}pushing=true;
  try{const cur=flat(),rows=[];
    for(const k in cur)if(cur[k]!==synced[k])rows.push({k,v:JSON.parse(cur[k]),deleted:false});
    for(const k in synced)if(!(k in cur))rows.push({k,v:null,deleted:true});
    const now=new Date().toISOString();
    for(let i=0;i<rows.length;i+=400){const part=rows.slice(i,i+400);
      const{error}=await sb.from('items').upsert(part.map(r=>({...r,updated_at:now})));if(error)throw error;
      for(const r of part){if(r.deleted)delete synced[r.k];else synced[r.k]=cur[r.k]}}
    if(rows.length)persistMeta();setSync('live');
  }catch(e){console.warn('Sync',e);setSync('off');clearTimeout(retryT);retryT=setTimeout(pushNow,8000)}
  finally{pushing=false;if(again){again=false;pushNow()}}
}
async function fetchAll(){let all=[];for(let f=0;;f+=1000){const{data,error}=await sb.from('items').select('k,v,deleted').order('k').range(f,f+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break}return all}
function blankS(){const b=seed();Object.assign(b,{members:[],events:[],chores:[],tasks:[],shop:[],stores:[],projects:[],loans:[],meals:{},shopHist:{},dog:{walks:[],feed:{},info:''}});return b}
async function fullSync(){
  setSync('busy');
  const rows=await fetchAll(),remote={};for(const r of rows)if(!r.deleted)remote[r.k]=r.v;
  if(!META.ever){
    if(Object.keys(remote).length){S=blankS();for(const k in remote)applyKey(k,remote[k]);synced={};for(const k in remote)synced[k]=canon(remote[k])}
    else synced={};
    META.ever=1;
  }else{const cur=flat();
    for(const k of new Set([...Object.keys(remote),...Object.keys(synced)])){const rs=k in remote?canon(remote[k]):undefined;
      if(cur[k]===synced[k]&&rs!==cur[k])applyKey(k,k in remote?remote[k]:undefined);
      if(rs===undefined)delete synced[k];else synced[k]=rs}}
  sortAll();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}persistMeta();
  await pushNow();setSync('live');
}
function applyRemote(row){
  if(!row||!row.k)return false;const k=row.k,rs=row.deleted?undefined:canon(row.v),cur=flat(),ls=cur[k];
  if(rs===ls){if(rs===undefined)delete synced[k];else synced[k]=rs;return false}
  if(ls!==synced[k])return false;
  applyKey(k,row.deleted?undefined:row.v);if(rs===undefined)delete synced[k];else synced[k]=rs;
  sortAll();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}persistMeta();return true
}
function selectInv(){const el=$('#invTxt');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function softRender(){if(gate)return;if(!sh.hidden||document.activeElement?.matches('input,select,textarea')){pendingRender=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&sh.hidden&&!document.activeElement?.matches('input,select,textarea')){pendingRender=false;render()}},50));
let chan=null;
function subscribe(){if(chan)sb.removeChannel(chan);
  chan=sb.channel('items').on('postgres_changes',{event:'*',schema:'public',table:'items'},p=>{if(applyRemote(p.new))softRender()})
    .subscribe(st=>setSync(st==='SUBSCRIBED'?'live':st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'?'off':'busy'))}
async function afterLogin(){
  try{await fullSync()}catch(e){console.warn(e);setSync('off');if(!META.ever){gate='login';render();toast('Keine Verbindung – bitte nochmal versuchen');return}}
  subscribe();
  const mm=session?.user?.user_metadata?.member;
  if(mm&&member(mm)){ME=mm;try{localStorage.setItem(KEY+'-me',mm)}catch(e){}}
  gate=ME&&member(ME)?null:'who';render();
  if(!gate&&session?.user?.user_metadata?.tmp)setTimeout(()=>pwSheet(true),400);
}
function loadLib(){return new Promise((ok,no)=>{if(window.supabase)return ok();const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js';x.onload=ok;x.onerror=no;document.head.append(x)})}
async function cloudStart(){
  if(!META.ever){gate='load';render()}
  try{await loadLib()}catch(e){if(!META.ever){gate='login';render()}setSync('off');toast('Offline – zeige gespeicherten Stand');return}
  sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((ev,ses)=>{session=ses;if(ev==='SIGNED_OUT'){gate='login';render()}});
  const{data}=await sb.auth.getSession();session=data.session;
  if(!session){gate='login';render();return}
  await afterLogin();
  try{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
function vLogin(){return `<form class="addbox" id="loginForm" style="padding:18px"><p class="note" style="margin-top:0">Melde dich mit deiner E-Mail an. Noch keinen Zugang? Miriam oder Achim können dich in der App einladen.</p>
  <label class="f"><span>E-Mail</span><input type="email" name="email" autocomplete="username" required style="width:100%;font-size:16px;padding:10px 12px;min-height:44px;border-radius:12px;border:1.5px solid var(--line)"></label>
  <label class="f"><span>Passwort</span><input type="password" name="pw" autocomplete="current-password" required style="width:100%;font-size:16px;padding:10px 12px;min-height:44px;border-radius:12px;border:1.5px solid var(--line)"></label>
  <div class="row"><button class="btn pri" style="width:100%">Anmelden</button></div><p class="note" id="loginErr"></p></form>`}
async function doLogin(e){e.preventDefault();const f=new FormData(e.target),err=$('#loginErr');err.textContent='Melde an …';
  const{data,error}=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:f.get('pw')});
  if(error){err.textContent=error.message==='Invalid login credentials'?'E-Mail oder Passwort stimmt nicht.':error.message;return}
  session=data.session;gate='load';render();await afterLogin()}
function vWho(){return `<p class="note" style="margin-top:-4px">Einmalig: Welche Person bist du? Das wird mit deinem Konto verknüpft.</p>
  <div class="pick">${people().map(m=>`<button data-act="setMe" data-id="${m.id}"${m.id===ME?' style="outline:2px solid var(--ink)"':''}><i style="--c:${m.color}">${esc(m.name.slice(0,2))}</i>${esc(m.name)}</button>`).join('')}</div>`}
async function setMe(id){ME=id;try{localStorage.setItem(KEY+'-me',id)}catch(e){}gate=null;go('woche');
  if(sb&&session&&session.user?.user_metadata?.member!==id)sb.auth.updateUser({data:{member:id}}).then(({data})=>{if(data?.user)session={...session,user:data.user}}).catch(()=>{});
  if(pushOn())try{const r=await navigator.serviceWorker.ready,sub=await r.pushManager.getSubscription();if(sub)await sb.from('push_subs').upsert({endpoint:sub.endpoint,member:ME,sub:sub.toJSON(),updated_at:new Date().toISOString()})}catch(e){}}
async function logout(){try{const r=await navigator.serviceWorker?.ready,sub=await r?.pushManager?.getSubscription();if(sub){await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}catch(e){}
  await sb.auth.signOut();for(const k of ['','-sync','-meta','-me','-push'])try{localStorage.removeItem(KEY+k)}catch(e){}
  location.reload()}
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushOn=()=>{try{return localStorage.getItem(KEY+'-push')==='1'&&window.Notification&&Notification.permission==='granted'}catch(e){return false}};
function pushBanner(){if(!CLOUD||pushOn()||view!=='woche')return'';try{if(localStorage.getItem(KEY+'-pushask'))return''}catch(e){}
  const ios=isIOS&&!standalone();
  return `<div class="rem"><div class="ri"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span><b>Push einschalten</b><small>${ios?'Erst über Teilen → „Zum Home-Bildschirm“, dann dort öffnen.':'Für neue To-dos und Termine.'}</small></span>${ios?'':'<button data-act="push">An</button>'}<button data-act="pushLater" class="rx" aria-label="Später">✕</button></div></div>`}
function b64uToBytes(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function enablePush(){
  if(!CLOUD)return;
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||!window.Notification){toast(isIOS&&!standalone()?'Erst über Teilen → „Zum Home-Bildschirm“ hinzufügen':'Dieses Gerät unterstützt keine Push-Nachrichten');return}
  try{const p=await Notification.requestPermission();if(p!=='granted'){toast('Nicht erlaubt – änderbar in den Handy-Einstellungen');return}
    const reg=await navigator.serviceWorker.ready;
    const{data,error}=await sb.functions.invoke('notify',{body:{action:'key'}});if(error||!data?.publicKey)throw error||new Error('Kein Schlüssel');
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(data.publicKey)});
    const{error:e2}=await sb.from('push_subs').upsert({endpoint:sub.endpoint,member:ME,sub:sub.toJSON(),updated_at:new Date().toISOString()});if(e2)throw e2;
    localStorage.setItem(KEY+'-push','1');toast('Push ist an');render();
  }catch(e){console.warn(e);toast('Push ging nicht: '+(e?.message||e))}
}
async function notify(to,title,body,wait){
  if(!CLOUD||!sb||!session)return null;to=[...new Set(to)].filter(Boolean);if(!to.length)return null;
  const p=sb.functions.invoke('notify',{body:{to,title,body}}).then(r=>r.data).catch(()=>null);return wait?p:null}
function showN(t,o){try{if(!(window.Notification&&Notification.permission==='granted'))return;if(navigator.serviceWorker?.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(t,o));else new Notification(t,o)}catch(e){}}
addEventListener('online',()=>{if(sb&&session)fullSync().then(()=>softRender()).catch(()=>{})});

go(location.hash.slice(1)||'woche');
if(CLOUD)cloudStart();
tick();setInterval(()=>{tick();if(view==='woche'&&sh.hidden&&!document.activeElement?.matches('input,select,textarea'))render()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(sh.hidden&&!gate)render();if(sb&&session&&META.ever)fullSync().then(()=>{softRender();if(!chan||chan.state!=='joined')subscribe()}).catch(()=>setSync('off'))}});
}
